# Render Blueprint — deploy the FastAPI backend.
# In Render: New → Blueprint → point at this repo, or configure a Web Service
# manually with the same settings below.
services:
  - type: web
    name: expense-auditor
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false # e.g. https://your-app.vercel.app,https://yourdomain.com
      - key: PYTHON_VERSION
        value: 3.11.9
